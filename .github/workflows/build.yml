name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            sidecars: "macos"
          - platform: windows-latest
            args: ""
            sidecars: "windows"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sidecars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.sidecars }}-${{ hashFiles('scripts/download-sidecars.sh', 'src-tauri/scripts/build-ffmpeg-slim.sh') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Install ffmpeg build deps (macOS)
        if: matrix.sidecars == 'macos'
        run: brew install lame

      - name: Prepare sidecars (yt-dlp + ffmpeg)
        shell: bash
        run: |
          if [ -d "src-tauri/binaries" ] && [ "$(ls -A src-tauri/binaries 2>/dev/null)" ]; then
            echo "Sidecars already cached, skipping"
            ls -lh src-tauri/binaries/
          else
            bash scripts/download-sidecars.sh ${{ matrix.sidecars }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voyage DL ${{ github.ref_name }}"
          releaseBody: "Download the .msi (Windows) or .dmg (macOS) below."
          releaseDraft: true
          args: ${{ matrix.args }}
