name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            sidecars: "macos"
          - platform: windows-latest
            args: ""
            sidecars: "windows"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sidecars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.sidecars }}-${{ hashFiles('scripts/download-sidecars.sh', 'src-tauri/scripts/build-ffmpeg-slim.sh') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Install ffmpeg build deps (macOS)
        if: matrix.sidecars == 'macos'
        run: brew install lame

      - name: Prepare sidecars (yt-dlp + ffmpeg)
        shell: bash
        run: |
          if [ -d "src-tauri/binaries" ] && [ "$(ls -A src-tauri/binaries 2>/dev/null)" ]; then
            echo "Sidecars already cached, skipping"
            ls -lh src-tauri/binaries/
          else
            bash scripts/download-sidecars.sh ${{ matrix.sidecars }}
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voyage DL ${{ github.ref_name }}"
          releaseBody: "Download the .msi (Windows) or .dmg (macOS) below."
          releaseDraft: true
          args: ${{ matrix.args }}
