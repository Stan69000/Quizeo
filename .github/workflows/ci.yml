name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend build and Rust manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Build frontend
        run: npm run build

      - name: Validate the locked Rust dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps --manifest-path src-tauri/Cargo.toml > /dev/null

